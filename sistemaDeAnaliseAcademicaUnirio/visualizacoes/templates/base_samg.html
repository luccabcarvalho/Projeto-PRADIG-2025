<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Apoio ao Monitoramento de Graduação{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%23333333' d='M60 512c0-99.4 80.6-180 180-180h32c99.4 0 180 80.6 180 180H60z'/%3E%3Cpath fill='%23EDF2F7' d='M156 288l100 100 100-100-40-20-60 48-60-48z'/%3E%3Cpolygon fill='%23E2E8F0' points='256,416 196,336 256,368 316,336'/%3E%3Cpolygon fill='%23F6AD55' points='244,336 268,336 276,356 256,376 236,356'/%3E%3Cpolygon fill='%23ED8936' points='244,360 268,360 278,432 256,476 234,432'/%3E%3Cpolygon fill='%23EDF2F7' points='340,408 376,376 404,408'/%3E%3Crect x='332' y='408' width='80' height='6' rx='3' fill='%232D3748'/%3E%3Cpath fill='%23F6AD55' d='M216 240h80v48c0 22.1-17.9 40-40 40s-40-17.9-40-40v-48z'/%3E%3Ccircle cx='256' cy='216' r='96' fill='%23F6AD55'/%3E%3Crect x='204' y='178' width='30' height='14' rx='7' fill='%232D3748'/%3E%3Crect x='278' y='178' width='30' height='14' rx='7' fill='%232D3748'/%3E%3Cpath fill='%233B495A' d='M148 64h216l-16 116H164L148 64z'/%3E%3Cpolygon fill='%232D3748' points='256,0 416,84 256,168 96,84'/%3E%3Cpath fill='none' stroke='%232D3748' stroke-width='12' stroke-linecap='round' stroke-linejoin='round' d='M256 84H102v64'/%3E%3Ccircle cx='102' cy='172' r='28' fill='%23DD6B20'/%3E%3Cpolygon fill='%23ED8936' points='80,188 124,188 134,244 70,244'/%3E%3C/svg%3E">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --unirio-blue: #2356a8;
            --unirio-blue-light: #2356a8;
            --unirio-black: #000;
            --unirio-white: #fff;
        }
        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--unirio-white) !important;
            color: var(--unirio-black);
            margin: 0;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(90deg, var(--unirio-blue) 70%, #3a7bd5 100%);
            color: var(--unirio-white);
            padding: 0.6rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            font-size: 1.15rem;
            letter-spacing: 1px;
        }
        .navbar-container {
            width: 100%;
            max-width: none;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            min-height: 45px;
        }
        .navbar-logo {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            text-shadow: 1px 2px 8px rgba(0,0,0,0.10);
            margin-right: auto;
        }
        .navbar-links {
            display: flex;
            gap: 2.5rem;
            margin-left: auto;
        }
        .navbar-links a {
            color: var(--unirio-white);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.18rem;
            padding: 0.4rem 1.1rem;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(35,86,168,0.04);
        }
        .navbar-links form {
            margin: 0;
            display: flex;
        }
        .navbar-links .logout-button {
            border: 0;
            background: transparent;
            color: var(--unirio-white);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.18rem;
            padding: 0.4rem 1.1rem;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(35,86,168,0.04);
            cursor: pointer;
        }
        .navbar-links .logout-button:hover {
            background: rgba(255,255,255,0.18);
            color: #e0eaff;
            box-shadow: 0 2px 12px rgba(35,86,168,0.10);
        }
        .navbar-links a:hover, .navbar-links .active {
            background: rgba(255,255,255,0.18);
            color: #e0eaff;
            text-decoration: none;
            box-shadow: 0 2px 12px rgba(35,86,168,0.10);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-graduation-cap"></i>  SAMG
            </div>
            <div class="navbar-links">
                <a href="{% url 'progresso' %}" {% if request.resolver_match.url_name == 'progresso' %}class="active"{% endif %}>Progresso</a>
                <a href="{% url 'migracao' %}" {% if request.resolver_match.url_name == 'migracao' %}class="active"{% endif %}>Migração</a>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="logout-button">Sair</button>
                </form>
            </div>
        </div>
    </nav>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
