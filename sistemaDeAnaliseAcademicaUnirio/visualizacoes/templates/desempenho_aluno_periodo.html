{% extends "base.html" %}
{% block title %}Progressão Individual{% endblock %}
{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function() {
        $('#matr_aluno').select2({
            placeholder: "Selecione um aluno",
            allowClear: true,
            width: '100%'
        });
        $('#filtros-form select').on('change', function() {
            $('#filtros-form').submit();
        });
    });
</script>
<style>
    .heatmap-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.2em;
        margin-top: 0.5em;
    }
    .heatmap-title {
        color: #003366;
        font-size: 2.1rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.5px;
    }
    .filtros-bar {
        display: flex;
        gap: 1.5em;
        align-items: center;
        padding: 1.2em 2em 1.2em 2em;
        margin-bottom: 1.2em;
        flex-wrap: nowrap;
        width: 70vw;
        max-width: 1100px;
        min-width: 0;
        margin-left: auto;
        margin-right: auto;
    }
    .filtro-item {
        display: flex;
        flex-direction: column;
        min-width: 180px;
        margin-bottom: 0.5em;
        margin-right: 1.2em;
    }
    .filtro-item label {
        color: #003366;
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 0.3em;
        white-space: nowrap;
        margin-left: 0.3em;
        margin-right: 0;
    }
    .filtro-item select {
        font-size: 1rem;
        border-radius: 5px;
        border: 1px solid #bfc9d1;
        padding: 0.4em 0.7em;
        background: #f7f9fb;
        color: #003366;
        outline: none;
        transition: border 0.2s;
        min-width: 120px;
    }
    .filtro-item select:focus {
        border: 1.5px solid #2356a8;
    }
    @media (max-width: 700px) {
        .heatmap-header {
            flex-direction: column;
            gap: 1em;
        }
        .heatmap-title {
            font-size: 1.3rem;
        }
    }
</style>
{% endblock %}
{% block content %}
<div class="heatmap-header">
    <h1 class="heatmap-title">Progressão Individual</h1>
</div>
<form method="get" id="filtros-form">
    <div class="filtros-bar">
        <div style="display:flex; align-items:center; gap:1.2em; flex:1 1 auto; min-width:0;">
            <div class="filtro-item">
                <label for="matr_aluno">Aluno:</label>
                <select name="matr_aluno" id="matr_aluno">
                    <option value="">Selecione</option>
                    {% for aluno in alunos_options %}
                        <option value="{{ aluno.id }}" {% if selected_id == aluno.id %}selected{% endif %}>{{ aluno.label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>
</form>
{% if mensagem %}
    <div style="display: flex; justify-content: center; width: 100%;">
        <div style="background: #f7f9fb; color: #003366; border: 4px solid #00336633; border-radius: 8px; padding: 2em 3em; font-size: 1.2rem; font-weight: 500; margin-top: 2em; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
            <span style="display: flex; align-items: center; gap: 0.7em;">
                {{ mensagem }}
            </span>
        </div>
    </div>
{% else %}
    <div style="display: flex; justify-content: center; width: 100%;">
        {{ plot_div|safe }}
    </div>
{% endif %}
{% endblock %}
